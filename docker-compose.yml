services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_pass}
      POSTGRES_DB: ${POSTGRES_DB:-studentdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student} -d ${POSTGRES_DB:-studentdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    image: student-api:${VERSION}
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-student}:${POSTGRES_PASSWORD:-student_pass}@db:5432/${POSTGRES_DB:-studentdb}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: