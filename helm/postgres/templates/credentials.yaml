apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.credentials.vault.serviceAccount }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.credentials.vault.server | quote }}
      path: {{ .Values.credentials.vault.kvPath | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ .Values.credentials.vault.authMountPath | quote }}
          role: {{ .Values.credentials.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.credentials.vault.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.credentials.vault.key }}