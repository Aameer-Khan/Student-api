image:
  repository: postgres
  tag: 17-alpine

nodeSelector:
  type: database

persistence:
  size: 1Gi

service:
  name: db
  port: 5432

credentials:
  secretName: db-credentials
  refreshInterval: 1h
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    kvPath: secret
    key: student-api/db
    authMountPath: kubernetes
    role: student-api
    serviceAccount: eso-vault
