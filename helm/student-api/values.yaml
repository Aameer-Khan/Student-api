replicaCount: 3

image:
  repository: docker.io/xilinx19/student-api
  tag: "1.1.0-b4a2368"
  pullPolicy: IfNotPresent

nodeSelector:
  type: application

config:
  LOG_LEVEL: INFO
  DB_HOST: db
  DB_PORT: "5432"

dbSecretName: db-credentials

service:
  type: NodePort
  port: 80
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
