apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "student-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "student-api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "student-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["flask", "--app", "app", "db", "upgrade"]
          {{- include "student-api.env" . | nindent 10 }}
      containers:
        - name: api
          image: {{ include "student-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
          {{- include "student-api.env" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}