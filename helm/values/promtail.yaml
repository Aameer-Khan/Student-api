nodeSelector:
  type: application

config:
  clients:
  - url: http://loki.observability.svc:3100/loki/api/v1/push
  snippets:
    pipelineStages:
    - cri: {}
    - drop:
        expression: ".*GET /healthcheck.*"
    extraRelabelConfigs:
    - action: keep
      source_labels: [ __meta_kubernetes_namespace ]
      regex: student-api
    - action: keep
      source_labels: [ __meta_kubernetes_pod_label_app_kubernetes_io_name ]
      regex: student-api
