injector:
  enabled: false

server:
  nodeSelector:
    type: dependent_services
  dataStorage:
    enabled: true
    size: 1Gi
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
