apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aameer-Khan/Student-api.git
    targetRevision: main
    path: helm/prometheus
    helm:
      releaseName: prometheus
      valueFiles:
      - ../values/prometheus.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
