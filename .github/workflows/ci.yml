name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "Makefile"
      - "ruff.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  IMAGE: docker.io/xilinx19/student-api

jobs:
  ci:
    runs-on: [self-hosted, cloud]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: make build
      - run: make lint
      - run: make test

      - name: Compute image tag
        id: meta
        run: echo "tag=$(make -s version)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG already exists, nothing to push"
            exit 0
          fi
          docker buildx build --platform linux/amd64,linux/arm64 -t "$IMAGE:$TAG" --push .

  update-helm:
    needs: ci
    runs-on: [self-hosted, cloud]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump image in Helm values
        env:
          TAG: ${{ needs.ci.outputs.tag }}
        run: |
          sed -i -E "s|^(  repository:).*|\1 ${IMAGE}|" helm/student-api/values.yaml
          sed -i -E "s|^(  tag:).*|\1 \"${TAG}\"|" helm/student-api/values.yaml
          git diff

      - name: Commit and push
        env:
          TAG: ${{ needs.ci.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/student-api/values.yaml
          if git diff --cached --quiet; then
            echo "Image tag already up to date"
            exit 0
          fi
          git commit -m "chore(helm): bump student-api image to ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main